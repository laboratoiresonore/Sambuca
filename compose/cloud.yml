# sambuca :: compose/cloud.yml — the SaaS replacements that hold real data
#
# Vaultwarden (passwords) · Nextcloud AIO (files/docs/calendar) · Immich (photos)
#
# These three carry irreplaceable user data, so they follow stricter rules than
# the rest of the mesh:
#   - never auto-updated (no watchtower label) — schema migrations are a decision
#   - databases live on the `data` network, which has no route off the host
#   - every one of them is in the nightly restic set

services:

  # ─────────────────────────────────────────────────────────────────────────
  # Vaultwarden — passwords and secrets.
  # ─────────────────────────────────────────────────────────────────────────
  vaultwarden:
    restart: unless-stopped
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:1.37.1-alpine@sha256:b094afed4ed5ea353821c6efcedca446f30c6654ba2bc441db6089b0c2b94ac8}
    container_name: sambuca-vaultwarden
    networks: [edge]
    secrets:
      - vaultwarden_admin_token
    volumes:
      - ${SAMBUCA_APPDATA}/vaultwarden:/data
    environment:
      TZ: ${TZ:-UTC}
      DOMAIN: https://vault.${SAMBUCA_DOMAIN:-sambuca.local}
      # Open registration on an appliance that may be reachable from a tailnet
      # of shared devices is not a default worth having.
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      # Vaultwarden reads any config option from a file via the _FILE suffix.
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      WEBSOCKET_ENABLED: "true"
      ROCKET_PORT: 80
      LOG_LEVEL: warn
      # Vaultwarden holds the keys to everything else. It authenticates its own
      # users and is NOT placed behind the forward-auth gate: chaining an
      # appliance-local IdP in front of the password manager that stores the
      # recovery credentials for that IdP is a circular dependency.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/alive >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────────────────
  # Nextcloud All-in-One.
  #
  # AIO is a MASTER CONTAINER: it orchestrates its own children through the
  # Docker socket rather than being a normal compose service. That is why it
  # gets a socket mount and a fixed volume name — both are AIO requirements, not
  # sambuca choices. Its children are not visible in this file.
  # ─────────────────────────────────────────────────────────────────────────
  nextcloud-aio:
    restart: unless-stopped
    # `:latest` HERE IS DELIBERATE, and it is the only place in this project
    # where a floating tag is. The mastercontainer is an UPDATER — it chooses
    # and upgrades the versions of the containers it manages. Pinning it does
    # not pin Nextcloud; it freezes the machinery that keeps Nextcloud patched,
    # so the stack stops receiving updates while still looking maintained.
    # Upstream publishes dated tags, but they are snapshots of the updater, not
    # of the deployment. tests/test_image_pins.py enforces that this stays the
    # exception rather than becoming the habit.
    image: ${NEXTCLOUD_AIO_IMAGE:-nextcloud/all-in-one:latest}
    container_name: nextcloud-aio-mastercontainer   # fixed name: AIO requires it
    # THE ONE SERVICE WITHOUT no-new-privileges, and it is a KNOWN GAP rather
    # than a decision. Every other service in this project carries it.
    #
    # It is not set here because it has not been verified, and this container is
    # the worst one to guess at: it holds the docker socket and spawns the whole
    # Nextcloud deployment, so getting it wrong does not degrade a feature — it
    # stops the file server existing. Upstream's own compose.yaml sets no
    # security_opt at all, and the only one it mentions is `label:disable` for
    # SELinux, which loosens rather than tightens. So there is no upstream
    # answer to copy either way.
    #
    # TO CLOSE IT (needs hardware, not reading): add
    #   security_opt: ["no-new-privileges:true"]
    # then confirm AIO still completes first-time setup AND can start, update
    # and stop its managed containers. If it cannot, replace this comment with
    # what broke — an unexplained gap invites somebody to "fix" it blind.
    #
    # tests/test_axis3_properties.py holds this as a named exception, so the
    # gap is asserted rather than merely absent.
    networks: [edge]
    volumes:
      - nextcloud_aio_mastercontainer:/mnt/docker-aio-config   # fixed: AIO requires it
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-UTC}
      # Caddy terminates TLS, so AIO serves plain HTTP behind it.
      APACHE_PORT: 11000
      APACHE_IP_BINDING: 0.0.0.0
      NEXTCLOUD_DATADIR: ${SAMBUCA_FILES}
      NEXTCLOUD_MOUNT: ${SAMBUCA_DATA}
      # We are behind a reverse proxy on a private network; AIO's public DNS
      # round-trip check cannot succeed and would block setup forever.
      SKIP_DOMAIN_VALIDATION: "true"
      NEXTCLOUD_UPLOAD_LIMIT: 16G
      NEXTCLOUD_MAX_TIME: 3600
      NEXTCLOUD_MEMORY_LIMIT: 1024M
      # AIO ships its own borg-based backup. Ours is restic, driven by
      # engine/maintenance/backup.sh, so AIO's is left off to avoid two
      # uncoordinated backup systems racing on the same data directory.
      AIO_DISABLE_BACKUP_SECTION: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8080 >/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ─────────────────────────────────────────────────────────────────────────
  # Immich — photos, with local face recognition and CLIP search.
  #
  # The machine-learning worker is the appliance's other big VRAM consumer.
  # Its device, image variant and memory ceiling all come from the arbitration
  # block in hardware-detect.sh. See that file for why inference wins ties.
  # ─────────────────────────────────────────────────────────────────────────
  immich-server:
    # no-new-privileges: a process here can never gain privileges through a
    # setuid binary. Cheap, and this image has no legitimate need for one.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    image: ${IMMICH_SERVER_IMAGE:-ghcr.io/immich-app/immich-server:v1.128.0@sha256:3306cbb62e5ac5fd1449b0a92990686b6795afa7bed7fd9aec8fb81c978dec91}
    container_name: sambuca-immich
    networks: [edge, data]
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_started
    secrets:
      - immich_db_password
    volumes:
      - ${SAMBUCA_PHOTOS}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ:-UTC}
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      # Immich documents DB_PASSWORD_FILE among its file-backed variables.
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2283/api/server/ping >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  immich-machine-learning:
    # no-new-privileges: a process here can never gain privileges through a
    # setuid binary. Cheap, and this image has no legitimate need for one.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # THE WHOLE REFERENCE ARRIVES IN ONE VARIABLE, resolved by 60-stack.sh from
    # the base pin plus the variant hardware-detect chose ("" for cpu, "-cuda",
    # "-openvino").
    #
    # This line used to read `${IMMICH_ML_IMAGE}${IMMICH_ML_IMAGE_SUFFIX}`, and
    # that concatenation is why a broken reference survived: verify-images.py
    # resolved IMMICH_ML_IMAGE, which is valid on its own, while what compose
    # pulled was base+suffix. On AMD the suffix was "-rocm", which upstream
    # publishes on no release tag (v1.128.0-rocm and v1.119.1-rocm both 404;
    # only `main-rocm` exists), so the container never started. The reference
    # that gets checked must be the reference that gets used.
    #
    # It is also what makes digest pinning possible: nothing can be appended to
    # a reference ending in "@sha256:…".
    image: ${IMMICH_ML_IMAGE:-ghcr.io/immich-app/immich-machine-learning:v1.128.0@sha256:8011358f5bd474d72b08a9dc1ad38f4c763ef0e4ebbc6012fd6141801268f141}
    container_name: sambuca-immich-ml
    networks: [data]
    volumes:
      - ${SAMBUCA_APPDATA}/immich/model-cache:/cache
    environment:
      TZ: ${TZ:-UTC}
      MACHINE_LEARNING_WORKERS: ${MACHINE_LEARNING_WORKERS:-1}
      MACHINE_LEARNING_WORKER_TIMEOUT: ${MACHINE_LEARNING_WORKER_TIMEOUT:-120}
      # Thread ceiling so a full-library re-index cannot starve inference of CPU.
      MACHINE_LEARNING_REQUEST_THREADS: ${IMMICH_ML_THREADS:-2}
      OMP_NUM_THREADS: ${IMMICH_ML_THREADS:-2}
    deploy:
      resources:
        limits:
          memory: ${IMMICH_ML_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:3003/ping')\" || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  immich-postgres:
    # no-new-privileges: a process here can never gain privileges through a
    # setuid binary. Cheap, and this image has no legitimate need for one.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    image: ${IMMICH_DB_IMAGE:-tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52}
    container_name: sambuca-immich-db
    networks: [data]
    secrets:
      - immich_db_password
    volumes:
      - ${SAMBUCA_APPDATA}/immich/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Valkey, not Redis — see the licence note in .env.example. Drop-in
  # compatible, so Immich still talks to it as REDIS_HOSTNAME and the binaries
  # keep their redis-* names for compatibility. The service keeps its old
  # container name so an existing appliance's volume path does not move.
  immich-redis:
    # no-new-privileges: a process here can never gain privileges through a
    # setuid binary. Cheap, and this image has no legitimate need for one.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    image: ${REDIS_IMAGE:-valkey/valkey:9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715}
    container_name: sambuca-immich-redis
    networks: [data]
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${SAMBUCA_APPDATA}/immich/redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nextcloud_aio_mastercontainer:
    name: nextcloud_aio_mastercontainer   # fixed name: AIO refuses to start otherwise
