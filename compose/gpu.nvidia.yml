# sambuca :: compose/gpu.nvidia.yml — CUDA overlay
#
# Appended to the COMPOSE_FILE chain by phase 60-stack when hardware-detect.sh
# resolved SAMBUCA_GPU_PROFILE=nvidia. Requires nvidia-container-toolkit, which
# phase 30 installs and smoke-tests.
#
# ONLY services that should touch the GPU appear here. immich-machine-learning
# is present but its device reservation is deliberately CONDITIONAL: the image
# suffix is empty (CPU) unless total VRAM cleared IMMICH_GPU_MIN_VRAM_MB, so on
# a 12-16 GiB card this overlay grants Immich a device it will not use, and
# inference keeps the whole card. That is the arbitration working as designed.

services:

  ollama:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Bound the fraction of VRAM the runner may map, leaving headroom for the
      # KV cache growth that otherwise triggers a mid-generation OOM.
      OLLAMA_GPU_OVERHEAD: ${OLLAMA_GPU_OVERHEAD:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-all}
              capabilities: [gpu]

  immich-machine-learning:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${IMMICH_ML_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
