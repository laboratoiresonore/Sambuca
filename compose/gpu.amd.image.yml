# sambuca :: compose/gpu.amd.image.yml — ROCm overlay — image plane
#
# UNVERIFIED ON REAL HARDWARE. No AMD card has run this. ROCm support for
# diffusion models is real but the device-plumbing below is written from the
# documented interface, not from a machine that booted — and this file says so
# rather than letting an owner discover it.
#
# HSA_OVERRIDE_GFX_VERSION is the usual reason a consumer Radeon works at all:
# ROCm ships kernels for a subset of gfx targets, and unsupported cards need to
# masquerade as a supported one. It is left EMPTY by default because guessing
# it wrong produces a hang rather than an error.

services:

  comfyui:
    image: ${COMFYUI_ROCM_IMAGE:-yanwk/comfyui-boot:rocm-20260814@sha256:3ff8b3b0d1a5168c581a77ef79b537a53a6b21c29215d7a7880987d0bd0c031a}
    environment:
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    # ONLY THE ADDITION. Compose APPENDS list values when it merges overlays,
    # it does not replace them — so repeating no-new-privileges:true here (which
    # image.yml already sets) produced the same entry twice, and compose rejects
    # a security_opt list with duplicates outright: "items at 0 and 1 are equal".
    #
    # That invalidated the WHOLE project, not just this service, so every
    # AMD + image combination failed to start at all. The base entry is
    # inherited; this only adds what ROCm needs on top.
    #
    # seccomp:unconfined IS A REAL WEAKENING and is here because ROCm's
    # userspace needs ioctls the default profile blocks. It is scoped to this
    # one service on one GPU profile, and no-new-privileges still applies —
    # which is precisely why it must not be dropped by accident.
    security_opt:
      - seccomp:unconfined
