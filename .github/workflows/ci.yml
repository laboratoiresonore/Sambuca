name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# SUPERSEDED RUNS CANCEL THEMSELVES.
#
# Every push queued a fresh full run while the previous one was still waiting,
# so a run of commits built a backlog that took HOURS to clear — and the answer
# people actually want (does the newest commit pass?) arrived last. Most of a
# day's verification was spent behind runs for commits already replaced.
#
# group is keyed on the workflow AND the ref, so main and a branch never cancel
# each other.
#
# cancel-in-progress is FALSE ON TAGS AND TRUE OTHERWISE. A tag run publishes a
# release; killing one halfway could leave assets partly uploaded. A branch run
# only reports, and the newest commit's answer is the only one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: lint engine scripts
        run: |
          shellcheck --severity=warning --external-sources \
            $(find engine -name '*.sh')
      - name: syntax-check the busybox sh scripts
        # These run in the Debian installer (ash), not bash. dash is the closest
        # widely available approximation and catches bashisms.
        run: |
          for f in engine/autoinstall/abort-countdown.sh \
                   engine/autoinstall/disk-select.sh \
                   engine/autoinstall/late-command.sh; do
            dash -n "$f" || exit 1
          done

  update-guard:
    name: update guard refuses poisoned updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: feed it deliberately malicious updates
        # The guard decides whether an update may be applied to an appliance
        # UNATTENDED. A guard that has never been shown an attack is an
        # assumption, not a control, and a silently broken one looks exactly
        # like a working one until the day it matters.
        run: bash tests/test-update-guard.sh

  steward:
    name: steward catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      # The catalogue is the only thing between "speak to your server" and "a
      # language model with a shell". Its safety properties are checked, not
      # asserted: a disruptive verb that stops confirming fails the build.
      - run: python tools/steward-lint.py

      # sb_atomic_write silently returned 0 on every failure, and
      # writing to a directory path 'succeeded' by moving the temp file
      # inside it. Both are the kind of fault that only shows up as a
      # missing config file weeks later.
      #
      # EVERY tests/test-*.sh, by glob, deliberately. Naming them one by one is
      # how the beacon shipped with 21 passing tests that CI never ran: written,
      # green locally, and invisible — the same shape as a module with no
      # callers. A new test file is now run because it exists, not because
      # somebody remembered to add a line here.
      - name: shell test suites
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(tests/test-*.sh)
          if ((${#suites[@]} == 0)); then
            echo "::error::no shell test suites found — the glob is wrong"
            exit 1
          fi
          echo "running ${#suites[@]} suite(s)"
          rc=0
          for t in "${suites[@]}"; do
            echo "=== $t"
            bash "$t" || rc=1
          done
          exit $rc

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stage dummy secret files
        # Compose resolves `secrets: file:` sources. Real secrets live in
        # /etc/sambuca/secrets on an appliance and obviously are not in the
        # repository, so CI materialises throwaway ones — which also makes this
        # job verify the secret WIRING, not just the YAML.
        run: |
          mkdir -p /tmp/sambuca-secrets
          for n in postgres_password immich_db_password vaultwarden_admin_token                    oauth2_client_id oauth2_client_secret pocket_id_encryption_key; do
            echo "ci-dummy-not-a-real-secret" > "/tmp/sambuca-secrets/$n"
          done
          echo "SAMBUCA_SECRETS_DIR=/tmp/sambuca-secrets" >> "$GITHUB_ENV"

      - name: validate every GPU profile against every bundle subset
        # The SUBSETS matter as much as the profiles. A compose override naming
        # a service that the selected bundles do not define invalidates the
        # WHOLE project, not just that service. That shipped once — the GPU
        # overlays declared immich-machine-learning, so dropping the `cloud`
        # bundle broke everything. This loop is why it cannot happen again.
        run: |
          cd compose
          fail=0
          for gpu in cpu nvidia amd; do
            for bundles in "" "ai" "cloud" "office" "comms" "image"                            "ai,cloud" "cloud,office" "ai,image" "image,cloud"                            "ai,cloud,office,comms" "ai,cloud,office,comms,image"; do
              chain="docker-compose.yml"
              IFS=',' read -ra sel <<< "$bundles"
              for b in "${sel[@]}"; do
                [ -n "$b" ] && chain="$chain:$b.yml"
              done
              for b in "${sel[@]}"; do
                if [ -n "$b" ] && [ -f "gpu.$gpu.$b.yml" ]; then
                  chain="$chain:gpu.$gpu.$b.yml"
                fi
              done
              # STDERR IS KEPT. It used to go to /dev/null, so a failure said
              # only THAT it failed and never why — which made a real AMD
              # regression undiagnosable from the log and sent somebody looking
              # for a machine with a Radeon in it. A check that hides the
              # reason is barely a check.
              if err=$(COMPOSE_FILE="$chain" COMPOSE_PATH_SEPARATOR=:                  docker compose --env-file .env.example config --quiet 2>&1); then
                echo "ok   gpu=$gpu bundles=[${bundles:-none}]"
              else
                echo "FAIL gpu=$gpu bundles=[${bundles:-none}]"
                echo "     chain=$chain"
                echo "$err" | sed 's/^/     | /'
                fail=1
              fi
            done
          done
          exit $fail

  flasher:
    name: flasher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The flasher runs on the operator's own machine, which is usually not
        # Linux. Testing only on ubuntu would miss exactly the platform quirks
        # that matter.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e './apps/flasher[dev]'
      - run: ruff check apps/flasher/src apps/flasher/tests tools tests
      # BOTH TEST TREES, and named as directories rather than as files.
      # tests/ holds what tests the APPLIANCE rather than the flasher — the
      # install beacon lives there, and it was written, passing, and invisible
      # to CI because this line said apps/flasher/tests and nothing else.
      # That is the same shape as a module with no callers: green locally,
      # absent from the build. Naming directories means the next appliance-side
      # test file is picked up without anyone remembering to edit this.
      - run: python -m pytest apps/flasher/tests tests -q

  caddy:
    name: caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate the Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/compose/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SAMBUCA_DOMAIN=sambuca.local \
            -e SAMBUCA_ACME_EMAIL= \
            -e CASAOS_PORT=8095 \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

  images:
    name: image references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: resolve every image reference against its registry
        # Exit 2 means only first-party images are unpublished, which is a known
        # pre-release state. Exit 1 means a third-party reference is broken and
        # an appliance would fail to pull it — that fails the build.
        #
        # `|| rc=$?` is load-bearing: steps run under `bash -e`, so a bare
        # invocation aborts the step the moment the script exits 2, and the
        # "expected pre-release" branch below becomes unreachable.
        run: |
          rc=0
          python tools/verify-images.py compose/.env.example || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::first-party images not yet published (expected pre-release)"
            exit 0
          fi
          exit "$rc"
