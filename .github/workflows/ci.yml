name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: lint engine scripts
        run: |
          shellcheck --severity=warning --external-sources \
            $(find engine -name '*.sh')
      - name: syntax-check the busybox sh scripts
        # These run in the Debian installer (ash), not bash. dash is the closest
        # widely available approximation and catches bashisms.
        run: |
          for f in engine/autoinstall/abort-countdown.sh \
                   engine/autoinstall/disk-select.sh \
                   engine/autoinstall/late-command.sh; do
            dash -n "$f" || exit 1
          done

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate every bundle combination
        run: |
          cd compose
          for gpu in gpu.cpu.yml gpu.nvidia.yml gpu.amd.yml; do
            COMPOSE_FILE="docker-compose.yml:ai.yml:cloud.yml:office.yml:comms.yml:$gpu" \
            COMPOSE_PATH_SEPARATOR=: \
            docker compose --env-file .env.example config --quiet \
              || { echo "FAILED with $gpu"; exit 1; }
            echo "ok: $gpu"
          done
      - name: validate the minimal core-only chain
        run: |
          cd compose
          COMPOSE_FILE="docker-compose.yml:gpu.cpu.yml" COMPOSE_PATH_SEPARATOR=: \
            docker compose --env-file .env.example config --quiet

  flasher:
    name: flasher
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The flasher runs on the operator's own machine, which is usually not
        # Linux. Testing only on ubuntu would miss exactly the platform quirks
        # that matter.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e './apps/flasher[dev]'
      - run: ruff check apps/flasher/src apps/flasher/tests
      - run: python -m pytest apps/flasher/tests -q

  caddy:
    name: caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate the Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/compose/config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SAMBUCA_DOMAIN=sambuca.local \
            -e SAMBUCA_ACME_EMAIL= \
            -e CASAOS_PORT=8095 \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile

  images:
    name: image references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: resolve every image reference against its registry
        # Exit 2 means only first-party images are unpublished, which is a known
        # pre-release state. Exit 1 means a third-party reference is broken and
        # an appliance would fail to pull it — that fails the build.
        run: |
          python tools/verify-images.py compose/.env.example
          rc=$?
          if [ $rc -eq 2 ]; then
            echo "::warning::first-party images not yet published (expected pre-release)"
            exit 0
          fi
          exit $rc
