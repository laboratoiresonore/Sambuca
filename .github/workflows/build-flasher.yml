name: build-flasher

# Compile the flasher into a single-file executable for Windows and macOS, so
# somebody can download one file and run it without installing Python.
#
# BUILT ON THE TARGET OS, NOT CROSS-COMPILED. PyInstaller freezes the running
# interpreter and its native extensions, so a macOS binary has to be produced on
# macOS. That is the whole reason this lives in CI rather than on a developer's
# machine — nobody has all three.
#
# NO INTEL-MAC BUILD. macos-13 was the last Intel runner and is being retired;
# in practice the job sat queued rather than failing, which is worse than not
# offering it. Intel Mac users run the flasher from source (`pip install
# ./apps/flasher`) — and note the flasher runs on the OPERATOR's machine, which
# is independent of the x86-64 hardware sambuca installs onto.
#
# These are UNSIGNED. macOS Gatekeeper will refuse to open the app on a normal
# download, and SmartScreen will warn on Windows. Signing needs an Apple
# Developer account and a Windows code-signing certificate, neither of which
# this project has. The release notes say so plainly rather than letting people
# discover it — and the workaround is documented, not hidden.

# A `paths` filter alongside `tags` is a footgun: for a tag push GitHub
# evaluates both, and a tag pointing at a commit that did not touch those paths
# never builds. A release that silently does not happen is the worst kind. The
# tag trigger therefore carries NO path filter; the path filter applies only to
# branch pushes, where skipping unrelated work is genuinely useful.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "apps/flasher/**"
      - "engine/**"
      - ".github/workflows/build-flasher.yml"

# `write` is required to publish a release. It was `read`, which builds the
# binaries and then cannot attach them to anything.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            binary: sambuca-flasher.exe
          - os: macos-latest
            label: macos-arm64
            binary: sambuca-flasher
          - os: ubuntu-latest
            label: linux-x64
            binary: sambuca-flasher

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the flasher and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ./apps/flasher pyinstaller

      - name: freeze
        shell: bash
        # --collect-all mnemonic: the BIP-39 wordlist is package DATA, not code.
        # PyInstaller's import analysis cannot see it, and a binary that ships
        # without it fails at the exact moment it generates a seed phrase.
        run: |
          # --add-data engine: THE BINARY MUST CARRY THE ENGINE.
          # Both write paths located it by walking up from __file__, which in a
          # one-file bundle points inside a temporary extraction directory. The
          # shipped binary therefore could not find preseed.cfg or the tier
          # profiles, so neither `write` nor `write-pi` worked at all — while
          # every check below passed, because none of them touch the engine.
          # PyInstaller wants os.pathsep between source and destination.
          # $PWD in git-bash on Windows is a POSIX path (/d/a/...). PyInstaller
          # received it as a backslashed version of that, could not find the
          # directory, and failed the build — v0.1.0-preview2 produced linux
          # and macOS binaries, failed windows, and therefore published nothing
          # at all. `pwd -W` is git-bash's way of asking for a real Windows
          # path (D:/a/...).
          case "${{ runner.os }}" in
            Windows) SEP=';' ; ROOT="$(pwd -W)" ;;
            *)       SEP=':' ; ROOT="$PWD" ;;
          esac
          echo "bundling engine and manifest from: $ROOT"

          # The manifest ships too. manifest.py falls back to a bundled copy
          # when GitHub is unreachable, and looks for it under _MEIPASS — a
          # binary without it cannot start offline.
          pyinstaller \
            --onefile \
            --name sambuca-flasher \
            --collect-all mnemonic \
            --collect-all reportlab \
            --add-data "$ROOT/engine${SEP}engine" \
            --add-data "$ROOT/manifest${SEP}manifest" \
            --console \
            apps/flasher/entrypoint.py

      - name: prove the binary actually runs
        shell: bash
        # A build that produces a file is not a build that produces a working
        # program. Exercise the offline paths that need no USB and no root:
        # every one of these would fail if a data file were missing.
        run: |
          BIN="dist/${{ matrix.binary }}"
          "$BIN" --version
          "$BIN" boot-guide "Dell XPS 15 9520" | grep -q "F12"
          "$BIN" example-config | grep -q '"hostname"'

          # THE CHECK THAT WAS MISSING, and the reason a broken binary shipped.
          # Everything above passes on a binary that cannot flash anything,
          # because none of it touches the engine. This asserts the bundle
          # actually carries it — the difference between a program that starts
          # and a program that does its job.
          "$BIN" write-pi --image apps/flasher/tests/fixtures/not-an-iso.img --dry-run 2>&1 \
            | tee /tmp/enginecheck.txt | grep -q "staged .* engine file" \
            || { echo "FAIL: the binary cannot find its bundled engine"; cat /tmp/enginecheck.txt; exit 1; }

          # And the bundled MANIFEST, which is what lets it start with no
          # network. Pointed at an unreachable host, the fallback must carry
          # it — a binary that only works online is not the offline-first
          # installer this project claims to ship.
          SAMBUCA_MANIFEST="http://127.0.0.1:1/unreachable.json" \
            "$BIN" write-pi --image apps/flasher/tests/fixtures/not-an-iso.img --dry-run 2>&1 \
            | grep -q "staged .* engine file" \
            || { echo "FAIL: no bundled manifest — the binary cannot work offline"; exit 1; }

          echo "the frozen binary works, engine and manifest included"

      - uses: actions/upload-artifact@v4
        with:
          name: sambuca-flasher-${{ matrix.label }}
          path: dist/${{ matrix.binary }}
          retention-days: 30

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # upload-artifact nests each one in its own directory. Flatten, and give
      # every binary a name that says which platform it is for — three files
      # all called `sambuca-flasher` in one release is useless.
      - name: collect and name the binaries
        run: |
          mkdir -p dist
          for d in artifacts/sambuca-flasher-*; do
            label="${d#artifacts/sambuca-flasher-}"
            src=$(find "$d" -type f | head -1)
            [ -z "$src" ] && { echo "no binary in $d"; exit 1; }
            case "$label" in
              windows-*) cp "$src" "dist/sambuca-flasher-${label}.exe" ;;
              *)         cp "$src" "dist/sambuca-flasher-${label}" ;;
            esac
          done
          chmod +x dist/sambuca-flasher-* 2>/dev/null || true
          ls -la dist/

      # The README points at this file and explains what it does and does not
      # prove: that the download arrived intact, not who built it.
      - name: checksums
        run: |
          cd dist && sha256sum sambuca-flasher-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sambuca-flasher-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'rc') }}
          body: |
            **These binaries are unsigned.** Your computer will warn you, and we
            would rather say so than let you discover it.

            - **Windows** — SmartScreen says "unrecognised app". More info -> Run anyway.
            - **macOS** — right-click the file -> Open, then confirm. Or
              `xattr -d com.apple.quarantine ./sambuca-flasher-macos-arm64`
            - **macOS / Linux** — `chmod +x ./sambuca-flasher-...` first.

            Signing needs an Apple Developer account and a Windows code-signing
            certificate; this project has neither. `SHA256SUMS.txt` proves a
            download arrived intact — not who made it.

            **No Intel Mac build** — the last Intel runner has been retired.
            Install from source instead: `pip install ./apps/flasher`

            Try it before committing anything. This touches no disk and needs no
            USB stick:

                sambuca-flasher boot-guide "Dell OptiPlex 7060"
