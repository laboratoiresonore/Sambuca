name: image-scan

# Vulnerability scan of every image the appliance actually runs.
#
# This is the highest-signal "is this genuinely secure" check available, and it
# is the one most self-hosted projects skip — they pin an image once, ship it,
# and it quietly accumulates known-exploitable CVEs for two years.
#
# FAILS ONLY ON FIXABLE HIGH/CRITICAL. A scanner that reports every unfixable
# CVE in a base image produces a wall of red nobody can act on, and a check
# nobody can act on is a check everyone learns to ignore. Fixable means an
# upstream patch exists, which means bumping the pin is a real remedy.

on:
  schedule:
    # 07:45 UTC — half an hour after upstream-drift, so a morning's alerts
    # arrive together rather than trickling.
    - cron: "45 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - "compose/.env.example"
      - ".github/workflows/image-scan.yml"
      - "tools/scan-images.sh"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: scan pinned images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: collect the image list
        id: images
        # Straight from the file the appliance actually renders from, so the
        # scan can never drift out of sync with what gets deployed. First-party
        # images that are not published yet are skipped rather than failing the
        # job — that state is already tracked by upstream-drift.
        run: |
          {
            echo 'list<<EOF'
            grep -E '^[A-Z0-9_]+_IMAGE=' compose/.env.example \
              | cut -d= -f2- \
              | grep -v 'laboratoiresonore' \
              | sort -u
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: scan each image
        run: |
          mkdir -p reports
          fail=0
          # No `set -e`: one broken image must not hide the results for the
          # other eighteen.
          while read -r img; do
            [ -n "$img" ] || continue
            safe="$(echo "$img" | tr '/:@' '___')"
            echo "::group::$img"
            if docker run --rm \
                 -v /var/run/docker.sock:/var/run/docker.sock \
                 -v "$PWD/reports:/reports" \
                 aquasec/trivy:latest image \
                   --scanners vuln \
                   --severity HIGH,CRITICAL \
                   --ignore-unfixed \
                   --exit-code 1 \
                   --format table \
                   --output "/reports/${safe}.txt" \
                   --timeout 10m \
                   "$img"; then
              echo "clean: $img"
            else
              rc=$?
              if [ $rc -eq 1 ]; then
                echo "::warning::fixable HIGH/CRITICAL findings in $img"
                cat "reports/${safe}.txt" || true
                fail=1
              else
                echo "::warning::trivy could not scan $img (exit $rc) — not treated as a finding"
              fi
            fi
            echo "::endgroup::"
          done <<< "${{ steps.images.outputs.list }}"
          echo "SCAN_FAIL=$fail" >> "$GITHUB_ENV"

      - name: summarise
        if: always()
        run: |
          {
            echo "## Image vulnerability scan"
            echo
            echo "Fixable HIGH/CRITICAL only. Unfixable findings are omitted:"
            echo "there is no action to take on them, and a check nobody can act"
            echo "on is a check everyone learns to ignore."
            echo
            for f in reports/*.txt; do
              [ -e "$f" ] || continue
              if [ -s "$f" ]; then
                echo "<details><summary>$(basename "$f" .txt)</summary>"
                echo
                echo '```'
                head -c 20000 "$f"
                echo '```'
                echo
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: reports/
          retention-days: 30

      - name: fail if anything fixable was found
        if: env.SCAN_FAIL == '1'
        run: |
          echo "::error::One or more images have FIXABLE high/critical vulnerabilities."
          echo "Bump the pin in compose/.env.example — a fixable finding means an"
          echo "upstream patch exists, so this is actionable rather than noise."
          echo "See docs/MAINTENANCE.md Tier 3."
          exit 1
