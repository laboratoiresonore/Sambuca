name: image-scan

# Vulnerability scan of every image the appliance actually runs.
#
# GATED ON REGRESSION, NOT ON ABSOLUTE STATE — and that is a correction to how
# this started. The first version failed on any fixable HIGH/CRITICAL, reasoning
# that "fixable" meant a patch existed so bumping the pin was a real remedy.
# Running it disproved that: fixable means the PACKAGE has a patch, not that the
# image PUBLISHER has rebuilt. Once we are on the newest published tag there is
# nothing left to bump, so the job goes red every day — and a job that is red
# every day is one everybody clicks past, which costs the attention a genuine
# regression would need.
#
# So: absolute counts are always REPORTED, and the build fails only when an
# image gets worse than a committed baseline. See tools/vuln-gate.py.

on:
  schedule:
    # 07:45 UTC, half an hour after upstream-drift, so a morning's findings
    # arrive together rather than trickling.
    - cron: "45 7 * * *"
  workflow_dispatch:
  push:
    paths:
      - "compose/.env.example"
      - "tools/vuln-baseline.json"
      - "tools/vuln-gate.py"
      - ".github/workflows/image-scan.yml"

permissions:
  contents: read

jobs:
  scan:
    name: scan pinned images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: collect the image list
        id: images
        # Straight from the file the appliance renders from, so the scan cannot
        # drift out of sync with what actually deploys. First-party images that
        # are not published yet are skipped — that state is already tracked by
        # the upstream-drift workflow.
        run: |
          {
            echo 'list<<EOF'
            grep -E '^[A-Z0-9_]+_IMAGE=' compose/.env.example \
              | cut -d= -f2- \
              | grep -v 'laboratoiresonore' \
              | sort -u
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: scan each image
        # --exit-code 0 throughout: this step COLLECTS, it does not judge. One
        # unscannable image must not hide the results for the other eighteen.
        run: |
          mkdir -p reports
          while read -r img; do
            [ -n "$img" ] || continue
            safe="$(echo "$img" | tr '/:@' '___')"
            echo "::group::$img"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/reports:/reports" \
              aquasec/trivy:latest image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 0 \
                --format json \
                --output "/reports/${safe}.json" \
                --timeout 10m \
                "$img" \
              || echo "::warning::could not scan $img — not treated as a finding"
            echo "::endgroup::"
          done <<< "${{ steps.images.outputs.list }}"

      - name: gate on regression against the committed baseline
        run: |
          rc=0
          python tools/vuln-gate.py reports | tee gate.log || rc=$?
          {
            echo "## Image vulnerability scan"
            echo
            echo '```'
            cat gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            echo "::error::An image regressed past its accepted vulnerability floor."
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-reports
          path: |
            reports/
            gate.log
          retention-days: 30
