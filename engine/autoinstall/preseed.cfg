# sambuca :: engine/autoinstall/preseed.cfg
#
# Unattended Debian 12 (bookworm) installation.
#
# ══════════════════════════════════════════════════════════════════════════
# THE DISK IS THE DANGEROUS PART
#
# An unattended installer that guesses which disk to erase will eventually
# erase the wrong one. This preseed therefore does NOT use `partman-auto/disk`
# with a hardcoded /dev/sda. Instead, engine/autoinstall/disk-select.sh runs
# first, applies the selection rules the owner declared in provision.json, and
# writes the chosen device back into debconf.
#
# Before any of that, abort-countdown.sh gives 30 seconds at the console with
# the target disk and its contents printed on screen. Any keypress cancels.
# ══════════════════════════════════════════════════════════════════════════

#### Localisation — overridden per-machine by first-boot from provision.json.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

#### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string sambuca
d-i netcfg/get_domain string local
d-i netcfg/hostname string sambuca
# A machine with no DHCP is a machine that cannot fetch packages. Fail visibly
# rather than dropping to a manual dialogue nobody is present to answer.
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcpv6_timeout string 60

#### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### Accounts
# Root is locked. The admin account is created by phase 10-system with the key
# from provision.json; the installer account exists only so the installer has a
# non-root user to create, and its password comes from the payload.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string sambuca operator
d-i passwd/username string sambuca
d-i passwd/user-password-crypted password $6$PLACEHOLDER_REPLACED_BY_FLASHER
d-i passwd/user-default-groups string audio cdrom video sudo

#### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

#### ══════════════════════════════════════════════════════════════════════
#### Partitioning — full-disk LUKS.
####
#### The target device is NOT set here. disk-select.sh sets
#### partman-auto/disk and grub-installer/bootdev at runtime.
#### ══════════════════════════════════════════════════════════════════════
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-crypto/passphrase password PLACEHOLDER_REPLACED_BY_FLASHER
d-i partman-crypto/passphrase-again password PLACEHOLDER_REPLACED_BY_FLASHER
# Erasing the disk before encrypting it hides how much data exists but takes
# hours on a spinning disk. Off by default; the flasher can turn it on.
d-i partman-crypto/erase_data boolean false

d-i partman-auto/choose_recipe select sambuca
d-i partman-auto/expert_recipe string                         \
      sambuca ::                                              \
              1024 1024 1024 fat32                            \
                      $primary{ } $bootable{ }                \
                      method{ efi } format{ }                 \
              .                                               \
              1024 1024 1024 ext4                             \
                      $primary{ }                             \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ /boot }                     \
              .                                               \
              4096 8000 -1 ext4                               \
                      $lvmok{ } lv_name{ root }               \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .                                               \
              1024 2048 8192 linux-swap                       \
                      $lvmok{ } lv_name{ swap }               \
                      method{ swap } format{ }                \
              .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-basicfilesystems/no_swap boolean false

#### Base system — headless, no desktop, no recommends.
d-i base-installer/install-recommends boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
tasksel tasksel/first multiselect ssh-server, standard
d-i pkgsel/include string curl ca-certificates gnupg jq git sudo openssh-server \
    cryptsetup-bin tpm2-tools pciutils rsync
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

#### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
# bootdev is set by disk-select.sh, not hardcoded.

#### Finish
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

#### ══════════════════════════════════════════════════════════════════════
#### Hooks
#### ══════════════════════════════════════════════════════════════════════

# BEFORE anything is written: confirm the target and offer the abort window.
d-i preseed/early_command string \
    cp /cdrom/sambuca/abort-countdown.sh /tmp/ 2>/dev/null || true; \
    cp /cdrom/sambuca/disk-select.sh /tmp/ 2>/dev/null || true; \
    chmod +x /tmp/abort-countdown.sh /tmp/disk-select.sh 2>/dev/null || true; \
    /tmp/disk-select.sh || true; \
    /tmp/abort-countdown.sh || true

# AFTER the base system exists.
#
# Two steps, and the order matters:
#
#   1. enroll-recovery-key.sh runs in the INSTALLER, not in-target. That is the
#      only moment at which the disk passphrase is legitimately available (from
#      debconf) without ever persisting it to the installed system. It adds the
#      seed-derived recovery key as a SECOND LUKS keyslot, so a forgotten root
#      passphrase becomes a nuisance instead of total, permanent data loss.
#      It is separated by ';' not '&&' — a failed enrolment must not abort the
#      installation, only degrade it, and first-boot reports the degradation.
#
#   2. late-command.sh runs in-target and stages the engine.
d-i preseed/late_command string \
    cp /cdrom/sambuca/enroll-recovery-key.sh /tmp/ && \
    chmod +x /tmp/enroll-recovery-key.sh && \
    /tmp/enroll-recovery-key.sh; \
    cp /cdrom/sambuca/late-command.sh /target/tmp/ && \
    chmod +x /target/tmp/late-command.sh && \
    in-target /tmp/late-command.sh
