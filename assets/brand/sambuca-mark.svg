<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     width="128" height="128" role="img" aria-labelledby="mark-title">
  <title id="mark-title">Sambuca mark</title>
  <!--
    The square mark: favicon, browser tab, tray icon, avatar.

    REDRAWN, not scaled down. The header's glow filter and 3px sparks turn to
    mud at 16px, and a favicon that reads as a grey smudge is worse than none.
    This keeps only what survives: the broken loop and the ramp through it,
    with heavier strokes and no filter.
  -->
  <defs>
    <linearGradient id="markRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#aa0000"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="#0d1117"/>

  <!-- The closed loop, broken into two arcs by the breach -->
  <path d="M34,64 C34,42 44,30 60,30 C71,30 79,36 82,45"
        fill="none" stroke="#c9d1d9" stroke-width="13" stroke-linecap="butt"/>
  <path d="M94,64 C94,86 84,98 68,98 C57,98 49,92 46,83"
        fill="none" stroke="#c9d1d9" stroke-width="13" stroke-linecap="butt"/>

  <!-- The ramp. Thicker than a scaled header would give, so it still reads as
       a deliberate slash rather than a hairline at favicon size. -->
  <polygon points="26,104 98,22 108,31 36,113" fill="url(#markRed)"/>
</svg>
