<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400"
     width="980" height="400" role="img"
     aria-labelledby="sambuca-title sambuca-desc">
  <title id="sambuca-title">Sambuca — the open-weights siege engine</title>
  <desc id="sambuca-desc">A heavy steel zero, the closed corporate loop, slashed
  open by a glowing red ramp. Sparks of data escape through the breach, beside
  the wordmark SAMBUCA.</desc>

  <!--
    LAYOUT BUDGET — measured in a browser, not estimated. The canvas is 980 wide
    for a reason: at 76px with 12px letter-spacing the wordmark is 473 units
    across, so on the original 800 canvas it ran to x=843 and the final A was
    simply cut off. The illustration ended at x=385 while the text began at 370,
    so a data spark also sat on top of the S.

    Current extents:  illustration 152..385   |   gutter   |   text 430..903
    If you move either half, re-render and measure again — getBBox() in the
    browser, not arithmetic.
  -->

  <defs>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Carries its own dark ground so it reads identically on GitHub's light and
       dark themes, with no <picture> element and two files to keep in sync. -->
  <rect width="980" height="400" fill="#0d1117" rx="12"/>

  <g transform="translate(60, 0)">
    <!-- The closed loop: top-left arc -->
    <path d="M120,200 C120,130 150,90 200,90 C235,90 260,110 270,140"
          fill="none" stroke="#484f58" stroke-width="40" stroke-linecap="butt"/>
    <path d="M120,200 C120,130 150,90 200,90 C235,90 260,110 270,140"
          fill="none" stroke="#c9d1d9" stroke-width="36" stroke-linecap="butt"/>

    <!-- The closed loop: bottom-right arc -->
    <path d="M280,200 C280,270 250,310 200,310 C165,310 140,290 130,260"
          fill="none" stroke="#484f58" stroke-width="40" stroke-linecap="butt"/>
    <path d="M280,200 C280,270 250,310 200,310 C165,310 140,290 130,260"
          fill="none" stroke="#c9d1d9" stroke-width="36" stroke-linecap="butt"/>

    <!-- The breach: the ramp through the loop -->
    <polygon points="100,330 310,70 325,80 115,340" fill="url(#neonRed)" filter="url(#glow)"/>

    <!-- Data escaping through it -->
    <circle cx="280" cy="90"  r="3" fill="#ff3333" filter="url(#glow)"/>
    <circle cx="310" cy="110" r="2" fill="#ff3333"/>
    <circle cx="295" cy="140" r="4" fill="#ff3333" filter="url(#glow)"/>
    <circle cx="95"  cy="280" r="3" fill="#ff3333" filter="url(#glow)"/>
    <circle cx="130" cy="310" r="2" fill="#ff3333"/>
  </g>

  <!-- Generic families only: GitHub blocks external font fetches from an
       <img>-embedded SVG, so a webfont would silently fall back and reflow. -->
  <text x="430" y="210"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="900" fill="#ffffff" letter-spacing="12">SAMBUCA</text>
  <text x="435" y="250"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#8b949e" letter-spacing="7">THE OPEN-WEIGHTS SIEGE ENGINE</text>
</svg>
